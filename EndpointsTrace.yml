  /usuarios/{id}/password:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: integer}
    patch:
      tags: [Usuarios]
      summary: Cambiar contraseña
      operationId: changeUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password_actual, password_nuevo]
              properties:
                password_actual:
                  type: string
                password_nuevo:
                  type: string
                  maxLength: 128
      responses:
        '200':
          description: Contraseña actualizada
        '401':
          description: Sesión no válida, expirada, o contraseña actual incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                AUTH_001:
                  summary: Token de sesión expirado
                  value:
                    data: null
                    msg:
                      code: AUTH_001
                      msg: "Sesión expirada, vuelva a iniciar sesión"
                AUTH_002:
                  summary: Token de sesión inválido o malformado
                  value:
                    data: null
                    msg:
                      code: AUTH_002
                      msg: "Sesión invalida, vuelva a iniciar sesión"
                AUTH_003:
                  summary: Contraseña actual incorrecta
                  value:
                    data: null
                    msg:
                      code: AUTH_003
                      msg: "Username o password incorrectos"
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Error de validación de la nueva contraseña
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VAL_002:
                  summary: Password no cumple longitud mínima
                  value:
                    data: null
                    msg:
                      code: VAL_002
                      msg: "La contraseña debe ser de mínimo 12 caracteres"
                VAL_003:
                  summary: Password sin mayúscula ni carácter especial
                  value:
                    data: null
                    msg:
                      code: VAL_003
                      msg: "La contraseña debe contener al menos una mayúscula o signo especial"
                VAL_004:
                  summary: Campo requerido faltante
                  value:
                    data: null
                    msg:
                      code: VAL_004
                      msg: "El campo {nombre del campo} es obligatorio"
                VAL_008:
                  summary: Nueva contraseña igual a la actual
                  value:
                    data: null
                    msg:
                      code: VAL_008
                      msg: "La contraseña nueva no puede ser igual a la actual"
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
