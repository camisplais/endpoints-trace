openapi: 3.0.4
info:
  title: API TRACE
  description: |
    API para la gestión de embarques, viajes y pruebas de entrega.
  contact:
    email: camjarag12@gmail.com
  version: 1.0.0

servers:
  - url: https://api.trace.cool

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ─── Auth ────────────────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ0-9\s]{3,20}$'
          example: "jperez"
        password:
          type: string
          maxLength: 128
          example: "miPassword123"

    OtpVerifyRequest:
      type: object
      required: [username, otp]
      properties:
        username:
          type: string
          example: "jperez"
        otp:
          type: string
          example: "483921"

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          description: Segundos hasta expiración
          example: 3600
        requires_otp:
          type: boolean
          description: Si es true, el login se completa en /auth/verify-otp
          example: true

    # ─── Roles ───────────────────────────────────────────────────────────────

    Rol:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ\s]{3,20}$'
          example: "operador"

    # ─── Empleados ───────────────────────────────────────────────────────────

    Empleado:
      type: object
      properties:
        id:
          type: integer
          example: 1
        no_empleado:
          type: integer
          example: 10042
        nombre:
          type: string
          minLength: 3
          maxLength: 36
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ\s]{3,36}$'
          example: "Juan"
        apellido_paterno:
          type: string
          minLength: 2
          maxLength: 21
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ\s]{2,21}$'
          example: "Pérez"
        apellido_materno:
          type: string
          minLength: 2
          maxLength: 21
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ\s]{2,21}$|^$'
          nullable: true
          example: "Rodríguez"
        fecha_nacimiento:
          type: string
          format: date
          example: "1990-05-15"
        fecha_ingreso:
          type: string
          format: date
          example: "2020-01-10"
        imagen:
          type: string
          maxLength: 255
          nullable: true
          example: "https://api.trace.cool/files/empleados/foto-001.jpg"
        departamento:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ\s]{3,20}$'
          example: "Logística"
        puesto:
          type: string
          minLength: 3
          maxLength: 34
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ\s]{3,34}$'
          example: "Chofer"
        estado:
          type: string
          enum: [disponible, ocupado]
          example: "disponible"

    EmpleadoCreate:
      type: object
      required: [no_empleado, nombre, apellido_paterno, fecha_nacimiento, fecha_ingreso, departamento, puesto]
      properties:
        no_empleado:
          type: integer
          example: 10042
        nombre:
          type: string
          minLength: 3
          maxLength: 36
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ\s]{3,36}$'
          example: "Juan"
        apellido_paterno:
          type: string
          minLength: 2
          maxLength: 21
          example: "Pérez"
        apellido_materno:
          type: string
          nullable: true
          example: "Rodríguez"
        fecha_nacimiento:
          type: string
          format: date
          example: "1990-05-15"
        fecha_ingreso:
          type: string
          format: date
          example: "2020-01-10"
        imagen:
          type: string
          nullable: true
        departamento:
          type: string
          minLength: 3
          maxLength: 20
          example: "Logística"
        puesto:
          type: string
          minLength: 3
          maxLength: 34
          example: "Chofer"

    # ─── Usuarios ────────────────────────────────────────────────────────────

    Usuario:
      type: object
      properties:
        id:
          type: integer
          example: 1
        rol_id:
          type: integer
          example: 2
        rol:
          $ref: '#/components/schemas/Rol'
        empleado_id:
          type: integer
          example: 5
        empleado:
          $ref: '#/components/schemas/Empleado'
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ0-9\s]{3,20}$'
          example: "jperez"
        estado:
          type: boolean
          description: true = activo, false = desactivado
          example: true
        google2fa_confirmed:
          type: boolean
          nullable: true
          example: false

    UsuarioCreate:
      type: object
      required: [rol_id, empleado_id, username, password]
      properties:
        rol_id:
          type: integer
          example: 2
        empleado_id:
          type: integer
          example: 5
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ0-9\s]{3,20}$'
          example: "jperez"
        password:
          type: string
          maxLength: 128
          example: "miPassword123"

    UsuarioUpdate:
      type: object
      properties:
        rol_id:
          type: integer
        username:
          type: string
          minLength: 3
          maxLength: 20
        estado:
          type: boolean

    # ─── Clientes ────────────────────────────────────────────────────────────

    Cliente:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          minLength: 3
          maxLength: 26
          pattern: '^(?!\s*$).{3,26}$'
          example: "Ford Motor Company"
        tipo:
          type: string
          enum: [médico, automotriz, aeroespacial, eléctrico]
          example: "automotriz"
        ubicacion:
          type: string
          minLength: 3
          maxLength: 45
          pattern: '^.{3,45}$'
          example: "Hermosillo, Sonora"
        documentos:
          type: array
          description: Documentos que este cliente debe subir por cada embarque
          items:
            $ref: '#/components/schemas/Documento'
          example:
            - id: 1
              nombre: "Carta de porte"
            - id: 3
              nombre: "Factura"

    ClienteCreate:
      type: object
      required: [nombre, tipo, ubicacion, documento_ids]
      properties:
        nombre:
          type: string
          minLength: 3
          maxLength: 26
          pattern: '^(?!\s*$).{3,26}$'
          example: "Ford Motor Company"
        tipo:
          type: string
          enum: [médico, automotriz, aeroespacial, eléctrico]
          example: "automotriz"
        ubicacion:
          type: string
          minLength: 3
          maxLength: 45
          example: "Hermosillo, Sonora"
        documento_ids:
          type: array
          description: IDs de los documentos requeridos para este cliente. El backend genera un registro en doc_cliente por cada uno.
          minItems: 1
          items:
            type: integer
          example: [1, 3, 4, 5]

    # ─── Documentos ──────────────────────────────────────────────────────────

    Documento:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          minLength: 3
          maxLength: 40
          pattern: '^(?!\s*$).{3,40}$'
          example: "Carta de porte"
        descripcion:
          type: string
          maxLength: 100
          nullable: true
          example: "Requerido para clientes automotrices en traslados interestatales"

    DocumentoCreate:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 3
          maxLength: 40
          example: "Carta de porte"
        descripcion:
          type: string
          maxLength: 100
          nullable: true
          example: "Requerido para clientes automotrices en traslados interestatales"

    # ─── Doc Cliente (relación cliente ↔ documentos) ─────────────────────────

    DocCliente:
      type: object
      properties:
        id:
          type: integer
          example: 1
        cliente_id:
          type: integer
          example: 1
        documento_id:
          type: integer
          example: 3
        documento:
          $ref: '#/components/schemas/Documento'


    # ─── Transporte ──────────────────────────────────────────────────────────

    Transporte:
      type: object
      properties:
        id:
          type: integer
          example: 1
        placas:
          type: string
          pattern: '^[0-9]{2}-[A-Z]{2}-[0-9][A-Z]$'
          example: "12-AB-3C"
        marca:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^(?!\s*$).{3,30}$'
          example: "Kenworth"
        carga_util:
          type: number
          format: float
          example: 22500.00
          description: Carga útil en kg
        imagen:
          type: string
          maxLength: 255
          nullable: true
          example: "https://api.trace.cool/files/transportes/kenworth-001.jpg"
        estado:
          type: string
          enum: [viaje, planta]
          example: "planta"

    TransporteCreate:
      type: object
      required: [placas, marca, carga_util]
      properties:
        placas:
          type: string
          pattern: '^[0-9]{2}-[A-Z]{2}-[0-9][A-Z]$'
          example: "12-AB-3C"
        marca:
          type: string
          minLength: 3
          maxLength: 30
          example: "Kenworth"
        carga_util:
          type: number
          format: float
          example: 22500.00
        imagen:
          type: string
          nullable: true

    # ─── Embarques ───────────────────────────────────────────────────────────

    Embarque:
      type: object
      properties:
        id:
          type: integer
          example: 1
        cliente_id:
          type: integer
          example: 1
        cliente:
          $ref: '#/components/schemas/Cliente'
        empleado_customer_id:
          type: integer
          example: 7
          description: Empleado de customer service que creó el embarque
        empleado_customer:
          $ref: '#/components/schemas/Empleado'
        plan_embarque:
          type: string
          maxLength: 100
          example: "PE-2024-00892"
          description: ID del plan de embarque en el ERP
        fecha:
          type: string
          format: date
          example: "2024-12-01"
        hora:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          example: "08:30:00"
        tipo:
          type: string
          enum: [expeditado, regular]
          example: "regular"
        tarima:
          type: integer
          example: 4
        cantidad_piezas:
          type: integer
          example: 320

    EmbarqueCreate:
      type: object
      required: [cliente_id, plan_embarque, fecha, hora, tipo, tarima, cantidad_piezas]
      properties:
        cliente_id:
          type: integer
          example: 1
        plan_embarque:
          type: string
          maxLength: 100
          example: "PE-2024-00892"
        fecha:
          type: string
          format: date
          example: "2024-12-01"
        hora:
          type: string
          example: "08:30:00"
        tipo:
          type: string
          enum: [expeditado, regular]
          example: "regular"
        tarima:
          type: integer
          example: 4
        cantidad_piezas:
          type: integer
          example: 320

    # ─── Pruebas de Entrega ──────────────────────────────────────────────────

    PruebaEntrega:
      type: object
      properties:
        id:
          type: integer
          example: 1
        embarque_id:
          type: integer
          example: 1
        doc_cliente_id:
          type: integer
          example: 2
          description: Documento requerido según el tipo de cliente
        doc_cliente:
          $ref: '#/components/schemas/DocCliente'
        ruta_imagen:
          type: string
          maxLength: 255
          example: "https://api.trace.cool/files/pruebas/prueba-001.jpg"

    PruebaEntregaCreate:
      type: object
      required: [doc_cliente_id, ruta_imagen]
      properties:
        doc_cliente_id:
          type: integer
          example: 2
        ruta_imagen:
          type: string
          maxLength: 255
          example: "https://api.trace.cool/files/pruebas/prueba-001.jpg"

    # ─── Viajes ──────────────────────────────────────────────────────────────

    Viaje:
      type: object
      properties:
        id:
          type: integer
          example: 1
        empleado_chofer_id:
          type: integer
          example: 3
        empleado_chofer:
          $ref: '#/components/schemas/Empleado'
        empleado_embarques_id:
          type: integer
          example: 8
        empleado_embarques:
          $ref: '#/components/schemas/Empleado'
        transporte_id:
          type: integer
          example: 2
        transporte:
          $ref: '#/components/schemas/Transporte'
        embarques:
          type: array
          items:
            $ref: '#/components/schemas/Embarque'
          description: Embarques asignados a este viaje (via viaje_embarque)

    ViajeCreate:
      type: object
      required: [empleado_chofer_id, empleado_embarques_id, transporte_id, embarque_ids]
      properties:
        empleado_chofer_id:
          type: integer
          example: 3
        empleado_embarques_id:
          type: integer
          example: 8
        transporte_id:
          type: integer
          example: 2
        embarque_ids:
          type: array
          items:
            type: integer
          example: [1, 2, 5]
          description: IDs de los embarques que irán en este viaje

    # ─── Seguimiento de Viaje ─────────────────────────────────────────────────

    SeguimientoViaje:
      type: object
      properties:
        id:
          type: integer
          example: 1
        viaje_id:
          type: integer
          example: 1
        entrada:
          type: string
          format: date-time
          nullable: true
          example: "2024-12-01T07:45:00Z"
        salida:
          type: string
          format: date-time
          nullable: true
          example: "2024-12-01T16:30:00Z"
        empleado_caseta_entrada_id:
          type: integer
          example: 12
        empleado_caseta_entrada:
          $ref: '#/components/schemas/Empleado'
        empleado_caseta_salida_id:
          type: integer
          example: 13
        empleado_caseta_salida:
          $ref: '#/components/schemas/Empleado'
        empleado_qr_id:
          type: integer
          example: 3
          description: Empleado (chofer) que generó el QR
        empleado_qr:
          $ref: '#/components/schemas/Empleado'
        qr:
          type: string
          maxLength: 255
          nullable: true
          example: "https://api.trace.cool/files/qr/qr-viaje-001.png"


    QrGenerateResponse:
      type: object
      properties:
        qr_url:
          type: string
          example: "https://api.trace.cool/files/qr/qr-viaje-001.png"
        qr_data:
          type: string
          description: Contenido codificado en el QR
          example: "TRACE-VIA-001-2024120108300"

    QrConsumeRequest:
      type: object
      description: El empleado de caseta escanea/consume el QR del chofer
      required: [qr_data, tipo]
      properties:
        qr_data:
          type: string
          description: Contenido leído del QR del chofer
          example: "TRACE-VIA-001-2024120108300"
        tipo:
          type: string
          enum: [entrada, salida]
          example: "entrada"

    # ─── Solicitudes ─────────────────────────────────────────────────────────

    Solicitud:
      type: object
      properties:
        id:
          type: integer
          example: 1
        id_viaje_embarque:
          type: integer
          example: 4
        id_empleado_emisor:
          type: integer
          example: 7
        empleado_emisor:
          $ref: '#/components/schemas/Empleado'
        id_empleado_receptor:
          type: integer
          example: 2
        empleado_receptor:
          $ref: '#/components/schemas/Empleado'
        tipo:
          type: string
          enum: [solicitar QR, pruebas de entrega desfasadas, pruebas de entrega pendientes, estatus de salida]
          example: "solicitar QR"
        estado:
          type: string
          enum: [aceptado, rechazado]
          nullable: true
          example: "aceptado"

    SolicitudCreate:
      type: object
      required: [id_viaje_embarque, id_empleado_receptor, tipo]
      properties:
        id_viaje_embarque:
          type: integer
          example: 4
        id_empleado_receptor:
          type: integer
          example: 2
        tipo:
          type: string
          enum: [solicitar QR, pruebas de entrega desfasadas, pruebas de entrega pendientes, estatus de salida]
          example: "solicitar QR"

    SolicitudResponder:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [aceptado, rechazado]
          example: "aceptado"

    # ─── Notificaciones ──────────────────────────────────────────────────────

    Notificacion:
      type: object
      properties:
        id:
          type: integer
          example: 1
        id_solicitud:
          type: integer
          example: 3
        solicitud:
          $ref: '#/components/schemas/Solicitud'
        notificacion:
          type: string
          minLength: 2
          maxLength: 30
          pattern: '^(?!\s*$).{2,30}$'
          example: "Nueva solicitud de QR"

    # ─── Genéricos ───────────────────────────────────────────────────────────

    PaginatedMeta:
      type: object
      properties:
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        last_page:
          type: integer
          example: 5

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "El campo username es requerido"

tags:
  - name: Autenticación
    description: Login con OTP propio
  - name: Roles
    description: Catálogo de roles del sistema
  - name: Empleados
    description: Gestión de empleados de la planta
  - name: Usuarios
    description: Cuentas de acceso al sistema (ligadas a empleados)
  - name: Clientes
    description: Clientes activos de la empresa
  - name: Documentos
    description: Catálogo de documentos requeridos para embarques
  - name: Transporte
    description: Unidades de transporte disponibles
  - name: Embarques
    description: Planeación de embarques (solo customer service)
  - name: Pruebas de Entrega
    description: Evidencias fotográficas por embarque y documento
  - name: Viajes
    description: Viajes que agrupan embarques con chofer y transporte
  - name: Seguimiento de Viaje
    description: Entradas, salidas y QR de los viajes
  - name: Solicitudes
    description: Solicitudes internas entre empleados
  - name: Notificaciones
    description: Notificaciones generadas por solicitudes

paths:

  # ════════════════════════════════════════════════════════════════════════════
  # 1. AUTENTICACIÓN
  # ════════════════════════════════════════════════════════════════════════════

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: |
        Valida credenciales. Si `requires_otp` es true, el token definitivo
        se obtiene completando el flujo en `/auth/verify-otp`.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/verify-otp:
    post:
      tags: [Autenticación]
      summary: Verificar OTP
      description: Verifica el código OTP enviado al empleado para completar el inicio de sesión.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: OTP válido, token JWT generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: OTP inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ════════════════════════════════════════════════════════════════════════════
  # 2. ROLES
  # ════════════════════════════════════════════════════════════════════════════

  /roles:
    get:
      tags: [Roles]
      summary: Listar roles
      operationId: getRoles
      responses:
        '200':
          description: Lista de roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rol'

    post:
      tags: [Roles]
      summary: Crear rol
      operationId: createRol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre:
                  type: string
                  minLength: 3
                  maxLength: 20
                  pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ\s]{3,20}$'
                  example: "operador"
      responses:
        '201':
          description: Rol creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rol'
        '409':
          description: El nombre del rol ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /roles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Roles]
      summary: Obtener rol por ID
      operationId: getRolById
      responses:
        '200':
          description: Rol encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rol'
        '404':
          description: Rol no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Roles]
      summary: Actualizar rol
      operationId: updateRol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre:
                  type: string
                  minLength: 3
                  maxLength: 20
      responses:
        '200':
          description: Rol actualizado
          content:
