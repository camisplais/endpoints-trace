openapi: 3.0.4
info:
  title: API TRACE
  description: |
    API para la gestión de embarques, viajes y pruebas de entrega.
  contact:
    email: camjarag12@gmail.com
  version: 1.2.0

servers:
- url: https://api.trace.cool

security:
- bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ─── Auth ────────────────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ0-9\s]{3,20}$'
          example: "jperez"
        password:
          type: string
          maxLength: 128
          example: "miPassword123"

    OtpVerifyRequest:
      type: object
      required: [username, otp]
      properties:
        username:
          type: string
          example: "jperez"
        otp:
          type: string
          example: "483921"

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          description: Segundos hasta expiración
          example: 3600
        requires_otp:
          type: boolean
          description: Si es true, el login se completa en /auth/verify-otp
          example: true

    # ─── Roles ───────────────────────────────────────────────────────────────

    Rol:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ\s]{3,20}$'
          example: "operador"

    # ─── Empleados etni ───────────────────────────────────────────────────────────

    Empleado:
      type: object
      properties:
        id:
          type: integer
          example: 1
        no_empleado:
          type: integer
          example: 10042
        nombre:
          type: string
          minLength: 3
          maxLength: 36
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ\s]{3,36}$'
          example: "Juan"
        apellido_paterno:
          type: string
          minLength: 2
          maxLength: 21
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ\s]{2,21}$'
          example: "Pérez"
        apellido_materno:
          type: string
          minLength: 2
          maxLength: 21
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ\s]{2,21}$|^$'
          nullable: true
          example: "Rodríguez"
        fecha_nacimiento:
          type: string
          format: date
          example: "1990-05-15"
        fecha_ingreso:
          type: string
          format: date
          example: "2020-01-10"
        imagen:
          type: string
          maxLength: 255
          nullable: true
          example: "https://api.trace.cool/files/empleados/foto-001.jpg"
        departamento:
          type: string
          enum: [supplyChain, transportes, seguridad]
          example: "supplyChain"
        puesto:
          type: string
          minLength: 3
          maxLength: 34
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ\s]{3,34}$'
          example: "Chofer"
        estado:
          type: string
          enum: [disponible, ocupado]
          example: "disponible"

    EmpleadoCreate:
      type: object
      required: [no_empleado, nombre, apellido_paterno, fecha_nacimiento, fecha_ingreso, departamento, puesto]
      properties:
        no_empleado:
          type: integer
          example: 10042
        nombre:
          type: string
          minLength: 3
          maxLength: 36
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ\s]{3,36}$'
          example: "Juan"
        apellido_paterno:
          type: string
          minLength: 2
          maxLength: 21
          example: "Pérez"
        apellido_materno:
          type: string
          nullable: true
          example: "Rodríguez"
        fecha_nacimiento:
          type: string
          format: date
          example: "1990-05-15"
        fecha_ingreso:
          type: string
          format: date
          example: "2020-01-10"
        imagen:
          type: string
          nullable: true
        departamento:
          type: string
          enum: [supplyChain, transportes, seguridad]
          example: "supplyChain"
        puesto:
          type: string
          minLength: 3
          maxLength: 34
          example: "Chofer"

    # ─── Usuarios ────────────────────────────────────────────────────────────

    Usuario:
      type: object
      properties:
        id:
          type: integer
          example: 1
        rol_id:
          type: integer
          example: 2
        rol:
          $ref: '#/components/schemas/Rol'
        empleado_id:
          type: integer
          example: 5
        empleado:
          $ref: '#/components/schemas/Empleado'
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ0-9\s]{3,20}$'
          example: "jperez"
        celular:
          type: string
          pattern: '^[0-9]{10}$'
          example: "6141234567"
        estado:
          type: boolean
          description: true = activo, false = desactivado
          example: true
        google2fa_confirmed:
          type: boolean
          nullable: true
          example: false

    UsuarioCreate:
      type: object
      required: [rol_id, empleado_id, username, password, celular]
      properties:
        rol_id:
          type: integer
          example: 2
        empleado_id:
          type: integer
          example: 5
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ0-9\s]{3,20}$'
          example: "jperez"
        password:
          type: string
          maxLength: 128
          example: "miPassword123"
        celular:
          type: string
          pattern: '^[0-9]{10}$'
          example: "6141234567"

    UsuarioUpdate:
      type: object
      properties:
        rol_id:
          type: integer
        username:
          type: string
          minLength: 3
          maxLength: 20
        celular:
          type: string
          pattern: '^[0-9]{10}$'
        estado:
          type: boolean

    # ─── Clientes ────────────────────────────────────────────────────────────

    Cliente:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          minLength: 3
          maxLength: 26
          pattern: '^(?!\s*$).{3,26}$'
          example: "Ford Motor Company"
        tipo:
          type: string
          enum: [medico, automotriz, aeroespacial, electrico]
          example: "automotriz"
        ubicacion:
          type: string
          minLength: 3
          maxLength: 45
          pattern: '^.{3,45}$'
          example: "Hermosillo, Sonora"
        documentos:
          type: array
          description: Documentos que este cliente debe subir por cada embarque
          items:
            $ref: '#/components/schemas/Documento'
          example:
          - id: 1
            nombre: "Carta de porte"
          - id: 3
            nombre: "Factura"

    ClienteCreate:
      type: object
      required: [nombre, tipo, ubicacion, documento_ids]
      properties:
        nombre:
          type: string
          minLength: 3
          maxLength: 26
          pattern: '^(?!\s*$).{3,26}$'
          example: "Ford Motor Company"
        tipo:
          type: string
          enum: [medico, automotriz, aeroespacial, electrico]
          example: "automotriz"
        ubicacion:
          type: string
          minLength: 3
          maxLength: 45
          example: "Hermosillo, Sonora"
        documento_ids:
          type: array
          description: IDs de los documentos requeridos para este cliente. El backend genera un registro en doc_cliente por cada uno.
          minItems: 1
          items:
            type: integer
          example: [1, 3, 4, 5]

    # ─── Documentos ──────────────────────────────────────────────────────────

    Documento:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          minLength: 3
          maxLength: 40
          pattern: '^(?!\s*$).{3,40}$'
          example: "Carta de porte"
        descripcion:
          type: string
          maxLength: 100
          nullable: true
          example: "Requerido para clientes automotrices en traslados interestatales"

    DocumentoCreate:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 3
          maxLength: 40
          example: "Carta de porte"
        descripcion:
          type: string
          maxLength: 100
          nullable: true
          example: "Requerido para clientes automotrices en traslados interestatales"

    ApiMessage:
      type: object
      required: [code, msg]
      properties:
        code:
          type: string
          example: "AUTH_01"
        msg:
          type: string
          example: "Error de autenticación"

    ApiResponse:
      type: object
      required: [data, msg]
      properties:
        data:
          nullable: true
          oneOf:
          - type: object
          - type: array
            items: {}
          - type: string
          - type: integer
          - type: number
          - type: boolean
        msg:
          $ref: '#/components/schemas/ApiMessage'

    ApiPaginatedResponse:
      type: object
      required: [data, meta, msg]
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          $ref: '#/components/schemas/PaginatedMeta'
        msg:
          $ref: '#/components/schemas/ApiMessage'

    # ─── Doc Cliente (relación cliente ↔ documentos) ─────────────────────────

    DocCliente:
      type: object
      properties:
        id:
          type: integer
          example: 1
        cliente_id:
          type: integer
          example: 1
        documento_id:
          type: integer
          example: 3
        documento:
          $ref: '#/components/schemas/Documento'

    DocClienteCreate:
      type: object
      required: [cliente_id, documento_id]
      properties:
        cliente_id:
          type: integer
          example: 1
        documento_id:
          type: integer
          example: 3


    # ─── Transporte ──────────────────────────────────────────────────────────

    Transporte:
      type: object
      properties:
        id:
          type: integer
          example: 1
        placas:
          type: string
          pattern: '^[0-9]{2}-[A-Z]{2}-[0-9][A-Z]$'
          example: "12-AB-3C"
        marca:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^(?!\s*$).{3,30}$'
          example: "Kenworth"
        carga_util:
          type: number
          format: float
          maximum: 999999.99
          example: 22500.00
          description: Carga útil en kg
        imagen:
          type: string
          maxLength: 255
          nullable: true
          example: "https://api.trace.cool/files/transportes/kenworth-001.jpg"
        estado:
          type: string
          enum: [viaje, planta]
          example: "planta"

    TransporteCreate:
      type: object
      required: [placas, marca, carga_util]
      properties:
        placas:
          type: string
          pattern: '^[0-9]{2}-[A-Z]{2}-[0-9][A-Z]$'
          example: "12-AB-3C"
        marca:
          type: string
          minLength: 3
          maxLength: 30
          example: "Kenworth"
        carga_util:
          type: number
          format: float
          maximum: 999999.99
          example: 22500.00
        imagen:
          type: string
          nullable: true

    # ─── Embarques ───────────────────────────────────────────────────────────

    Embarque:
      type: object
      properties:
        id:
          type: integer
          example: 1
        cliente_id:
          type: integer
          example: 1
        cliente:
          $ref: '#/components/schemas/Cliente'
        empleado_customer_id:
          type: integer
          example: 7
          description: Empleado de customer service que creó el embarque
        empleado_customer:
          $ref: '#/components/schemas/Empleado'
        transporte_id:
          type: integer
          example: 2
        transporte:
          $ref: '#/components/schemas/Transporte'
        plan_embarque:
          type: string
          maxLength: 20
          example: "PE-2024-00892"
          description: ID del plan de embarque en el ERP
        fecha:
          type: string
          format: date
          example: "2024-12-01"
        hora:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          example: "08:30:00"
        tipo:
          type: string
          enum: [expeditado, regular]
          example: "regular"
        tarima:
          type: integer
          example: 4
        cantidad_piezas:
          type: integer
          example: 320
        estado:
          type: string
          enum: [activo, inactivo]
          example: "activo"

    EmbarqueCreate:
      type: object
      required: [cliente_id, transporte_id, plan_embarque, fecha, hora, tipo, tarima, cantidad_piezas]
      properties:
        cliente_id:
          type: integer
          example: 1
        transporte_id:
          type: integer
          example: 2
        plan_embarque:
          type: string
          maxLength: 20
          example: "PE-2024-00892"
        fecha:
          type: string
          format: date
          example: "2024-12-01"
        hora:
          type: string
          example: "08:30:00"
        tipo:
          type: string
          enum: [expeditado, regular]
          example: "regular"
        tarima:
          type: integer
          example: 4
        cantidad_piezas:
          type: integer
          example: 320

    # ─── Importación CSV de Embarques ────────────────────────────────────────

    EmbarqueImportRow:
      type: object
      description: Una fila del CSV interpretada como un embarque, con sus posibles errores de validación.
      properties:
        fila:
          type: integer
          description: Número de fila en el CSV (para referencia del usuario)
          example: 2
        datos:
          $ref: '#/components/schemas/EmbarqueCreate'
        errores:
          type: array
          description: Errores de validación encontrados en esta fila. Vacío si la fila es válida.
          items:
            type: string
          example: []

    EmbarqueImportConfirm:
      type: object
      required: [embarques]
      properties:
        embarques:
          type: array
          description: Filas ya revisadas/editadas por el usuario en pantalla, listas para insertarse en la tabla de embarques.
          items:
            $ref: '#/components/schemas/EmbarqueCreate'

    # ─── Pruebas de Entrega ──────────────────────────────────────────────────

    PruebaEntrega:
      type: object
      properties:
        id:
          type: integer
          example: 1
        embarque_id:
          type: integer
          example: 1
        doc_cliente_id:
          type: integer
          example: 2
          description: Documento requerido según el tipo de cliente
        doc_cliente:
          $ref: '#/components/schemas/DocCliente'
        ruta_imagen:
          type: string
          maxLength: 255
          example: "https://api.trace.cool/files/pruebas/prueba-001.jpg"

    PruebaEntregaCreate:
      type: object
      required: [doc_cliente_id, ruta_imagen]
      properties:
        doc_cliente_id:
          type: integer
          example: 2
        ruta_imagen:
          type: string
          maxLength: 255
          example: "https://api.trace.cool/files/pruebas/prueba-001.jpg"

    # ─── Viajes ──────────────────────────────────────────────────────────────

    Viaje:
      type: object
      properties:
        id:
          type: integer
          example: 1
        empleado_chofer_id:
          type: integer
          example: 3
        empleado_chofer:
          $ref: '#/components/schemas/Empleado'
        empleado_embarques_id:
          type: integer
          example: 8
        empleado_embarques:
          $ref: '#/components/schemas/Empleado'
        transporte_id:
          type: integer
          example: 2
        transporte:
          $ref: '#/components/schemas/Transporte'
        viaje_embarques:
          type: array
          items:
            $ref: '#/components/schemas/ViajeEmbarque'
          description: Relación viaje-embarque usada para consultar y administrar los embarques del viaje
        embarques:
          type: array
          items:
            $ref: '#/components/schemas/Embarque'
          description: Embarques asignados a este viaje (via viaje_embarque)

    ViajeCreate:
      type: object
      required: [empleado_chofer_id, empleado_embarques_id, transporte_id, embarque_ids]
      properties:
        empleado_chofer_id:
          type: integer
          example: 3
        empleado_embarques_id:
          type: integer
          example: 8
        transporte_id:
          type: integer
          example: 2
          description: Transporte asignado manualmente por el usuario al crear el viaje. Debe estar en estado "planta" (disponible).
        embarque_ids:
          type: array
          items:
            type: integer
          example: [1, 2, 5]
          description: IDs de los embarques que irán en este viaje.
        pruebas_entrega:
          type: array
          description: |
            Pruebas de entrega subidas al momento de crear el viaje.
            Si faltan documentos por subir, el empleado deberá generar una
            solicitud (tipo "pruebas de entrega pendientes" o "pruebas de
            entrega desfasadas") para poder subirlas después.
          items:
            type: object
            required: [embarque_id, doc_cliente_id, ruta_imagen]
            properties:
              embarque_id:
                type: integer
                example: 5
              doc_cliente_id:
                type: integer
                example: 2
              ruta_imagen:
                type: string
                maxLength: 255
                example: "https://api.trace.cool/files/pruebas/prueba-001.jpg"

    ViajeEmbarque:
      type: object
      properties:
        id:
          type: integer
          example: 1
        viaje_id:
          type: integer
          example: 1
        embarque_id:
          type: integer
          example: 5
        embarque:
          $ref: '#/components/schemas/Embarque'

    # ─── Seguimiento de Viaje ─────────────────────────────────────────────────

    SeguimientoViaje:
      type: object
      properties:
        id:
          type: integer
          example: 1
        viaje_id:
          type: integer
          example: 1
        entrada:
          type: string
          format: date-time
          nullable: true
          example: "2024-12-01T07:45:00Z"
        salida:
          type: string
          format: date-time
          nullable: true
          example: "2024-12-01T16:30:00Z"
        empleado_caseta_entrada_id:
          type: integer
          example: 12
        empleado_caseta_entrada:
          $ref: '#/components/schemas/Empleado'
        empleado_caseta_salida_id:
          type: integer
          example: 13
        empleado_caseta_salida:
          $ref: '#/components/schemas/Empleado'
        empleado_qr_id:
          type: integer
          example: 3
          description: Empleado (chofer) que generó el QR
        empleado_qr:
          $ref: '#/components/schemas/Empleado'
        qr:
          type: string
          maxLength: 255
          nullable: true
          example: "https://api.trace.cool/files/qr/qr-viaje-001.png"


    QrGenerateResponse:
      type: object
      properties:
        qr_url:
          type: string
          example: "https://api.trace.cool/files/qr/qr-viaje-001.png"
        qr_data:
          type: string
          description: Contenido codificado en el QR
          example: "TRACE-VIA-001-2024120108300"

    QrConsumeRequest:
      type: object
      description: El empleado de caseta escanea/consume el QR del chofer
      required: [qr_data, tipo]
      properties:
        qr_data:
          type: string
          description: Contenido leído del QR del chofer
          example: "TRACE-VIA-001-2024120108300"
        tipo:
          type: string
          enum: [entrada, salida]
          example: "entrada"

    # ─── Solicitudes ─────────────────────────────────────────────────────────

    Solicitud:
      type: object
      properties:
        id:
          type: integer
          example: 1
        id_viaje_embarque:
          type: integer
          example: 4
        id_empleado_emisor:
          type: integer
          example: 7
        empleado_emisor:
          $ref: '#/components/schemas/Empleado'
        id_empleado_receptor:
          type: integer
          example: 2
        empleado_receptor:
          $ref: '#/components/schemas/Empleado'
        tipo:
          type: string
          enum: [solicitar QR, pruebas de entrega desfasadas, pruebas de entrega pendientes, estatus de salida]
          example: "solicitar QR"
        estado:
          type: string
          enum: [aceptado, rechazado]
          nullable: true
          example: "aceptado"

    SolicitudCreate:
      type: object
      required: [id_viaje_embarque, id_empleado_receptor, tipo]
      properties:
        id_viaje_embarque:
          type: integer
          example: 4
        id_empleado_receptor:
          type: integer
          example: 2
        tipo:
          type: string
          enum: [solicitar QR, pruebas de entrega desfasadas, pruebas de entrega pendientes, estatus de salida]
          example: "solicitar QR"

    SolicitudResponder:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [aceptado, rechazado]
          example: "aceptado"

    # ─── Notificaciones ──────────────────────────────────────────────────────

    Notificacion:
      type: object
      properties:
        id:
          type: integer
          example: 1
        id_solicitud:
          type: integer
          example: 3
        solicitud:
          $ref: '#/components/schemas/Solicitud'
        notificacion:
          type: string
          minLength: 2
          maxLength: 30
          pattern: '^(?!\s*$).{2,30}$'
          example: "Nueva solicitud de QR"

    # ─── Genéricos ───────────────────────────────────────────────────────────

    PaginatedMeta:
      type: object
      properties:
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        last_page:
          type: integer
          example: 5

    Error:
      type: object
      required: [data, msg]
      properties:
        data:
          nullable: true
          example: null
        msg:
          $ref: '#/components/schemas/ApiMessage'

  responses:
    Unauthorized:
      description: Sesión no válida o expirada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            AUTH_001:
              summary: Token de sesión expirado
              value:
                data: null
                msg:
                  code: AUTH_001
                  msg: "Sesión expirada, vuelva a iniciar sesión"
            AUTH_002:
              summary: Token de sesión inválido o malformado
              value:
                data: null
                msg:
                  code: AUTH_002
                  msg: "Sesión invalida, vuelva a iniciar sesión"

    Forbidden:
      description: El usuario no tiene permisos para realizar esta acción
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            ROL_001:
              summary: Sin permisos para el módulo
              value:
                data: null
                msg:
                  code: ROL_001
                  msg: "No tienes permisos para este módulo"

    ServerError:
      description: Error interno del servidor o al guardar en base de datos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            SERVER_001:
              summary: Error interno del servidor
              value:
                data: null
                msg:
                  code: SERVER_001
                  msg: "Algo salió mal, intenta de nuevo más tarde"
            SERVER_002:
              summary: Error al guardar en base de datos
              value:
                data: null
                msg:
                  code: SERVER_002
                  msg: "No se pudo guardar la información, intenta de nuevo"

    RequestTimeout:
      description: El servidor no respondió a tiempo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            data: null
            msg:
              code: SERVER_003
              msg: "La solicitud tardó demasiado, intenta de nuevo"

    ValidationErrorGeneric:
      description: Error de validación de los datos enviados
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            VAL_004:
              summary: Campo requerido faltante
              value:
                data: null
                msg:
                  code: VAL_004
                  msg: "El campo {nombre del campo} es obligatorio"
            VAL_007:
              summary: Formato de campo inválido
              value:
                data: null
                msg:
                  code: VAL_007
                  msg: "El campo no cumple con el formato requerido"

    FileError:
      description: Error relacionado con el archivo/imagen enviado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            FILE_001:
              summary: Tipo de archivo inválido
              value:
                data: null
                msg:
                  code: FILE_001
                  msg: "El formato del archivo no es el correcto"
            FILE_002:
              summary: Archivo excede el tamaño permitido
              value:
                data: null
                msg:
                  code: FILE_002
                  msg: "El archivo no debe pesar mas de 30 MB"
            FILE_003:
              summary: Contenido del archivo no cumple la estructura requerida
              value:
                data: null
                msg:
                  code: FILE_003
                  msg: "El contenido del archivo no cumple la estructura requerida"
            FILE_004:
              summary: Archivo excede el tamaño permitido
              value:
                data: null
                msg:
                  code: FILE_004
                  msg: "El archivo no debe pesar mas de 20 MB"
            
            
tags:
- name: Autenticación
  description: Login con OTP propio
- name: Roles
  description: Catálogo de roles del sistema
- name: Empleados
  description: Gestión de empleados de la planta
- name: Usuarios
  description: Cuentas de acceso al sistema (ligadas a empleados)
- name: Clientes
  description: Clientes activos de la empresa
- name: Documentos
  description: Catálogo de documentos requeridos para embarques
- name: Transporte
  description: Unidades de transporte disponibles
- name: Embarques
  description: Planeación de embarques (solo customer service)
- name: Pruebas de Entrega
  description: Evidencias fotográficas por embarque y documento
- name: Viajes
  description: Viajes que agrupan embarques con chofer y transporte
- name: Seguimiento de Viaje
  description: Entradas, salidas y QR de los viajes
- name: Solicitudes
  description: Solicitudes internas entre empleados
- name: Notificaciones
  description: Notificaciones generadas por solicitudes

paths:

  # ════════════════════════════════════════════════════════════════════════════
  # 1. AUTENTICACIÓN
  # ════════════════════════════════════════════════════════════════════════════

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: |
        Valida credenciales. Si `requires_otp` es true, el token definitivo
        se obtiene completando el flujo en `/auth/verify-otp`.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                data: null
                msg:
                  code: AUTH_003
                  msg: "Username o password incorrectos"
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VAL_001:
                  summary: Username no cumple longitud mínima
                  value:
                    data: null
                    msg:
                      code: VAL_001
                      msg: "El username debe contener minimo 8 caracteres"
                VAL_002:
                  summary: Password no cumple longitud mínima
                  value:
                    data: null
                    msg:
                      code: VAL_002
                      msg: "La contraseña debe ser de mínimo 12 caracteres"
                VAL_004:
                  summary: Campo requerido faltante
                  value:
                    data: null
                    msg:
                      code: VAL_004
                      msg: "El campo {nombre del campo} es obligatorio"
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /auth/verify-otp:
    post:
      tags: [Autenticación]
      summary: Verificar OTP
      description: Verifica el código OTP enviado al empleado para completar el inicio de sesión.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: OTP válido, token JWT generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: OTP inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                OTP_001:
                  summary: Código OTP incorrecto
                  value:
                    data: null
                    msg:
                      code: OTP_001
                      msg: "El código de verificación es incorrecto"
                OTP_002:
                  summary: Código OTP expirado
                  value:
                    data: null
                    msg:
                      code: OTP_002
                      msg: "El código de verificación esta expirado"
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                data: null
                msg:
                  code: VAL_004
                  msg: "El campo {nombre del campo} es obligatorio"
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /auth/request-change-password: 
    post:
      tags: [Autenticación]
      summary: Solicitar Recuperación de Contraseña
      description: Solicitar Recuperación de la Contraseña
      operationId: requestChangePassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                nombre:
                  type: string
                  minLength: 10
                  maxLength: 20
                  pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ\s]{3,20}$'
                  example: "ecastror@clayens.com"
      responses:
        '200':
          description: Solicitud enviada a tu celular
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                data: null
                msg:
                  code: VAL_004
                  msg: "El campo {nombre del campo} es obligatorio"
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /auth/change-password: 
    post:
      tags: [Autenticación]
      summary: Recuperación de Contraseña
      description: Recuperación de la Contraseña
      operationId: changePassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                nombre:
                  type: string
                  minLength: 8
                  maxLength: 20
                  pattern: '^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ\s]{3,20}$'
                  example: "12345678"
      responses:
        '200':
          description: Contraseña cambiada correctamente
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                data: null
                msg:
                  code: VAL_004
                  msg: "El campo {nombre del campo} es obligatorio"
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /auth/disable-account/{id}: 
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    put:
      tags: [Autenticación]
      summary: Desactivar Cuenta
      description: Desactivar Cuenta
      operationId: disableAccount
      responses:
        '200':
          description: Cuenta Desactivada Correctamente
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                data: null
                msg:
                  code: VAL_004
                  msg: "El campo {nombre del campo} es obligatorio"
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/RequestTimeout'        
