                $ref: '#/components/schemas/Error'

  # ════════════════════════════════════════════════════════════════════════════
  # 10. SEGUIMIENTO DE VIAJE (QR, entrada/salida)
  # ════════════════════════════════════════════════════════════════════════════

  /viajes/{id}/seguimiento:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Seguimiento de Viaje]
      summary: Obtener seguimiento del viaje
      operationId: getSeguimientoByViaje
      responses:
        '200':
          description: Seguimiento del viaje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeguimientoViaje'
        '404':
          description: Viaje no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /viajes/{id}/qr:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Seguimiento de Viaje]
      summary: Generar QR del viaje (chofer)
      description: El chofer genera el QR desde su app para mostrárselo al empleado de caseta.
      operationId: generateQr
      responses:
        '201':
          description: QR generado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrGenerateResponse'
        '404':
          description: Viaje no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /seguimiento/consumir-qr:
    post:
      tags: [Seguimiento de Viaje]
      summary: Consumir QR (empleado de caseta)
      description: |
        El empleado de caseta escanea el QR del chofer desde su app.
        Si `tipo` es "entrada" registra la entrada; si es "salida" registra la salida.
      operationId: consumirQr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrConsumeRequest'
      responses:
        '200':
          description: QR consumido, seguimiento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeguimientoViaje'
        '400':
          description: QR inválido o ya consumido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Viaje no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ════════════════════════════════════════════════════════════════════════════
  # 11. SOLICITUDES
  # ════════════════════════════════════════════════════════════════════════════

  /solicitudes:
    get:
      tags: [Solicitudes]
      summary: Listar solicitudes
      operationId: getSolicitudes
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
        - name: tipo
          in: query
          schema:
            type: string
            enum: [solicitar QR, pruebas de entrega desfasadas, pruebas de entrega pendientes, estatus de salida]
        - name: estado
          in: query
          schema:
            type: string
            enum: [aceptado, rechazado]
        - name: empleado_receptor_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Lista de solicitudes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Solicitud'
                  meta:
                    $ref: '#/components/schemas/PaginatedMeta'

    post:
      tags: [Solicitudes]
      summary: Crear solicitud
      operationId: createSolicitud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCreate'
      responses:
        '201':
          description: Solicitud creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solicitud'
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /solicitudes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Solicitudes]
      summary: Obtener solicitud por ID
      operationId: getSolicitudById
      responses:
        '200':
          description: Solicitud encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solicitud'
        '404':
          description: Solicitud no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /solicitudes/{id}/responder:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Solicitudes]
      summary: Responder solicitud (aceptar o rechazar)
      operationId: responderSolicitud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudResponder'
      responses:
        '200':
          description: Solicitud respondida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solicitud'
        '404':
          description: Solicitud no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ════════════════════════════════════════════════════════════════════════════
  # 12. NOTIFICACIONES
  # ════════════════════════════════════════════════════════════════════════════

  /notificaciones:
    get:
      tags: [Notificaciones]
      summary: Listar notificaciones del usuario autenticado
      operationId: getNotificaciones
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Lista de notificaciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notificacion'
                  meta:
                    $ref: '#/components/schemas/PaginatedMeta'

  /notificaciones/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Notificaciones]
      summary: Obtener notificación por ID
      operationId: getNotificacionById
      responses:
        '200':
          description: Notificación encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notificacion'
        '404':
          description: Notificación no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'