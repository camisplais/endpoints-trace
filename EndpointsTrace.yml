  /seguimiento/consumir-qr:
    post:
      tags: [Seguimiento de Viaje]
      summary: Consumir QR (empleado de caseta)
      description: |
        El empleado de caseta escanea el QR del chofer desde su app.
        Si `tipo` es "entrada" registra la entrada; si es "salida" registra la salida.
      operationId: consumirQr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrConsumeRequest'
      responses:
        '200':
          description: QR consumido, seguimiento actualizado
          content:
            application/json:
              schema:
                type: object
                required: [data, msg]
                properties:
                  data:
                    $ref: '#/components/schemas/SeguimientoViaje'
                  msg:
                    $ref: '#/components/schemas/ApiMessage'
        '400':
          description: QR inválido, no corresponde a ningún viaje, o ya expiró
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                QR_001:
                  summary: Formato de QR inválido
                  value:
                    data: null
                    msg:
                      code: QR_001
                      msg: "El QR no contiene el formato adecuado"
                QR_002:
                  summary: QR no corresponde a ningún viaje
                  value:
                    data: null
                    msg:
                      code: QR_002
                      msg: "El QR no corresponde a ningún viaje registrado"
                QR_003:
                  summary: QR expirado
                  value:
                    data: null
                    msg:
                      code: QR_003
                      msg: "El QR ha superado su tiempo de validez"
        '404':
          description: "Viaje no encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                data: null
                msg:
                  code: VAL_005
                  msg: "Viaje no encontrado"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationErrorGeneric'
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
